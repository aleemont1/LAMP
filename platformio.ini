; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = espidf
monitor_speed = 115200
build_flags = 
	-Icomponents/LoRaMultiPacket/include
	-std=c++17
	-D ESP_PLATFORM

board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults
upload_speed = 115200

lib_ldf_mode = deep

build_src_filter = 
	+<src/>
	+<components/LoRaMultiPacket/src/*.cpp>

[env:heltec_transmitter]
extends = env:heltec_wifi_lora_32_V3
build_flags = 
	${env:heltec_wifi_lora_32_V3.build_flags}
	-D NODE_MODE_TX
upload_port = /dev/ttyUSB1

[env:heltec_receiver]
extends = env:heltec_wifi_lora_32_V3
build_flags = 
	${env:heltec_wifi_lora_32_V3.build_flags}
	-D NODE_MODE_RX
upload_port = /dev/ttyUSB0

[env:heltec_hw_test_tx]
extends = env:heltec_wifi_lora_32_V3
build_flags = 
	${env:heltec_wifi_lora_32_V3.build_flags}
	-D RUN_HW_TEST
	-D NODE_MODE_TX
upload_port = /dev/ttyUSB1

[env:heltec_hw_test_rx]
extends = env:heltec_wifi_lora_32_V3
build_flags = 
	${env:heltec_wifi_lora_32_V3.build_flags}
	-D RUN_HW_TEST
	-D NODE_MODE_RX
upload_port = /dev/ttyUSB0


[env:native]
platform = native
test_framework = unity
build_flags = 
	-std=c++17
	-I components/LoRaMultiPacket/include
	-g
test_build_src = true
build_src_filter = 
	-<*>
	+<../components/LoRaMultiPacket/src/*.cpp>
;lib_deps = jgromes/RadioLib@^7.5.0

[env:heltec_paper_test_tx]
extends = env:heltec_wifi_lora_32_V3
build_flags = 
	${env:heltec_wifi_lora_32_V3.build_flags}
	-D RUN_PAPER_TEST
	-D NODE_MODE_TX
upload_port = /dev/ttyUSB1

[env:heltec_paper_test_rx]
extends = env:heltec_wifi_lora_32_V3
build_flags = 
	${env:heltec_wifi_lora_32_V3.build_flags}
	-D RUN_PAPER_TEST
	-D NODE_MODE_RX
upload_port = /dev/ttyUSB0

[env:heltec_paper_test_rx_lossy]
extends = env:heltec_wifi_lora_32_V3
build_flags = 
	${env:heltec_wifi_lora_32_V3.build_flags}
	-D RUN_PAPER_TEST
	-D NODE_MODE_RX
	-D PAPER_TEST_DROP_RATE=20
upload_port = /dev/ttyUSB0

[env:heltec_bench_tx]
extends = env:heltec_wifi_lora_32_V3
build_flags = 
	${env:heltec_wifi_lora_32_V3.build_flags}
	-D RUN_BENCH
	-D NODE_MODE_TX
upload_port = /dev/ttyUSB1

[env:heltec_bench_rx]
extends = env:heltec_wifi_lora_32_V3
build_flags = 
	${env:heltec_wifi_lora_32_V3.build_flags}
	-D RUN_BENCH
	-D NODE_MODE_RX
upload_port = /dev/ttyUSB0
